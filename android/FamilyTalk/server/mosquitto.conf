# TLS only, password required, no anonymous access.
listener 8883
protocol mqtt
certfile /certs/fullchain.pem
keyfile /certs/privkey.pem
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwd

# Hold sealed chat messages for phones that are offline (QoS 1, persistent sessions).
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 14d
max_queued_messages 5000
message_size_limit 262144
# Never log message contents (they are encrypted anyway) or topics.
log_type error
log_type warning
connection_messages false
