# coturn: relays already-encrypted (DTLS-SRTP) call media when phones can't connect directly.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
# Replace with your own long random password and your domain.
user=family:CHANGE_ME_LONG_RANDOM_PASSWORD
realm=turn.example.com
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
no-cli
no-multicast-peers
# Block relaying into private networks (prevents abuse of your server as a proxy).
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
min-port=49160
max-port=49200
no-stdout-log
