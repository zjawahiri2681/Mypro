name: Build FamilyTalk APK

on:
  push:
    paths:
      - "android/FamilyTalk/**"
      - ".github/workflows/familytalk-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: familytalk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/FamilyTalk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILYTALK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILYTALK_KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
            echo "FAMILYTALK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keys/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias familytalk -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=FamilyTalk, OU=Personal, O=Mypro, C=SA" >/dev/null
            echo "FAMILYTALK_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "generated=true" >> "$GITHUB_OUTPUT"
            # The throwaway key is never uploaded anywhere: a leaked signing key would let
            # someone else publish a "FamilyTalk update" that installs over the real one.
            echo "::warning::No FAMILYTALK_KEYSTORE_BASE64 secret - this APK is signed with a throwaway key, so the next build will not install as an update. Create your own key once (see android/FamilyTalk/README.md) and add it as repository secrets."
          fi
          echo "FAMILYTALK_KEYSTORE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"
          echo "FAMILYTALK_KEY_ALIAS=familytalk" >> "$GITHUB_ENV"
          echo "FAMILYTALK_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Unit tests (core - crypto, roster, dial plan, call logic)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          VERSION=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          OUT="FamilyTalk-v${VERSION}-build${{ github.run_number }}.apk"
          mkdir -p dist && cp "$APK" "dist/$OUT"
          sha256sum "dist/$OUT" | tee "dist/$OUT.sha256"
          echo "apk=android/FamilyTalk/dist/$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=android/FamilyTalk/dist/$OUT.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=familytalk-v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: FamilyTalk-apk
          path: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.sha }}
          if-no-files-found: error

      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: familytalk-core-test-report
          path: android/FamilyTalk/core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Publish GitHub release with the APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: FamilyTalk ${{ steps.collect.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            FamilyTalk APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Install on each family phone (Android 9+): download the `.apk`, allow "install unknown apps" for your browser/file manager, open it.
            Check the SHA-256 against the `.sha256` file before installing.
          files: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.sha }}
