name: Build RFID Guard APK

on:
  push:
    paths:
      - "android/RFIDGuard/**"
      - ".github/workflows/rfidguard-build.yml"
  workflow_dispatch:

# Read-only by default; only the manual release job below may write.
permissions:
  contents: read

concurrency:
  group: rfidguard-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to exact commits so a moved tag cannot change what runs here.
jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.collect.outputs.tag }}
      version: ${{ steps.collect.outputs.version }}
      stable: ${{ steps.signing.outputs.stable }}
    defaults:
      run:
        working-directory: android/RFIDGuard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RFIDGUARD_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Using the signing key from repository secrets."
          else
            # A throw-away key that never leaves this runner. This repository is public, so the key
            # is deliberately NOT uploaded anywhere. Builds signed this way cannot update each other.
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/keys/release.jks" -storepass "$PASS" -keypass "$PASS" \
              -alias rfidguard -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=RFID Guard, OU=Personal, O=Mypro, C=SA" >/dev/null 2>&1
            (umask 077 && printf '%s' "$PASS" > "$RUNNER_TEMP/keys/one-off-pass")
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No RFIDGUARD_KEYSTORE_BASE64 secret: this build is signed with a one-off key. It installs, but a later build cannot be installed over it without uninstalling (which erases the vault). See android/RFIDGuard/README.md, 'Signing'."
          fi
          echo "RFIDGUARD_KEYSTORE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"
          echo "RFIDGUARD_KEY_ALIAS=rfidguard" >> "$GITHUB_ENV"
          echo "RFIDGUARD_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon --stacktrace

      # The keystore password is given to this step only, never to the job environment, and the
      # key material is removed from the runner before any later step runs.
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.RFIDGUARD_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -f "$RUNNER_TEMP/keys/one-off-pass" ]; then
            export RFIDGUARD_KEYSTORE_PASSWORD="$(cat "$RUNNER_TEMP/keys/one-off-pass")"
          else
            export RFIDGUARD_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          rm -rf "$RUNNER_TEMP/keys"

      - name: Collect artifacts
        id: collect
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          VERSION=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          OUT="RFIDGuard-v${VERSION}-build${{ github.run_number }}.apk"
          mkdir -p dist && cp "$APK" "dist/$OUT"
          (cd dist && sha256sum "$OUT" | tee "$OUT.sha256")
          echo "apk=android/RFIDGuard/dist/$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=android/RFIDGuard/dist/$OUT.sha256" >> "$GITHUB_OUTPUT"
          echo "tag=rfidguard-v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RFIDGuard-apk
          path: |
            ${{ steps.collect.outputs.apk }}
            ${{ steps.collect.outputs.sha }}
          if-no-files-found: error

      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rfidguard-core-test-report
          path: android/RFIDGuard/core/build/reports/tests/test
          if-no-files-found: ignore

  # This repository is public, so a release is a public download. It is only published when the
  # workflow is started by hand (Actions -> Build RFID Guard APK -> Run workflow). Pushes build
  # and test, and leave the APK as a workflow artifact (downloadable by signed-in GitHub users).
  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RFIDGuard-apk
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: RFID Guard ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Android APK built from `${{ github.ref_name }}` @ ${{ github.sha }}. Needs Android 11 or newer and NFC.

            Install: download the `.apk` below onto the phone, allow "unknown sources" for the installer, open it.
            Check the SHA-256 against the `.sha256` file before installing.

            Signed with the repository's release key: ${{ needs.build.outputs.stable }}. When `false`, this build used a one-off key and
            cannot be installed over another build; export an encrypted backup in the app before switching builds.
          files: |
            dist/*.apk
            dist/*.sha256
